name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QR_IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: QR_IMAGE_TAG
          script: |
            set -e
            cd /opt/spoo
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            grep -v '^QR_IMAGE_TAG=' .env > .env.tmp 2>/dev/null || true
            echo "QR_IMAGE_TAG=${QR_IMAGE_TAG}" >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env
            docker compose --env-file .env -f docker-compose.prod.yml pull qr
            docker compose --env-file .env -f docker-compose.prod.yml up -d --no-deps qr
            docker image prune -f

      - name: Verify health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            sleep 8
            for i in 1 2 3 4 5; do
              if docker exec spoo_qr curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
                echo "qr healthy after $i attempts"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 5
            done
            echo "qr health check failed after 5 attempts"
            docker compose -f /opt/spoo/docker-compose.prod.yml logs --tail=100 qr
            exit 1
